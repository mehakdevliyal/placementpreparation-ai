<!DOCTYPE html>
<html lang="en" class="dark-theme">
<head>
    <title>Resume Interview - AI Interview Platform</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="You have an interview in progress. Choose to resume or start a fresh interview.">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800;900&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
    <script>
    (function() {
        document.documentElement.classList.add('dark-theme');
            document.documentElement.setAttribute('data-theme', 'dark');
            localStorage.setItem('theme', 'dark');
    })();
    </script>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <style>
        :root {
            --page-bg:    #f0f4ff;
            --page-glow:  rgba(59, 130, 246, 0.07);
            --card-bg:    #ffffff;
            --card-border: rgba(0, 0, 0, 0.07);
            --card-shadow: 0 20px 50px rgba(37, 99, 235, 0.08);
            --heading-color: #0f172a;
            --body-color: #475569;
        }

        html.dark-theme {
            --page-bg:    #0b0f19;
            --page-glow:  rgba(59, 130, 246, 0.06);
            --card-bg:    rgba(10, 15, 29, 0.65);
            --card-border: rgba(255, 255, 255, 0.08);
            --card-shadow: 0 20px 50px rgba(0, 0, 0, 0.35);
            --heading-color: #f0f6ff;
            --body-color:  #8aa4cc;
        }

        body {
            min-height: 100vh;
            font-family: 'Inter', sans-serif;
            position: relative;
            overflow-x: hidden;
            transition: background-color 0.25s ease, color 0.25s ease;
            background: var(--page-bg) !important;
            background-image: none !important;
        }

        html.dark-theme body {
            background: #020510 !important;
            background-image: none !important;
        }

        /* ═══════════════════════════════════════════
           GOATED BACKGROUND — Animated Aurora System
        ═══════════════════════════════════════════ */
        .db-bg {
            position: fixed;
            inset: 0;
            z-index: 0;
            pointer-events: none;
            overflow: hidden;
            display: none;
        }
        html.dark-theme .db-bg {
            display: block;
        }

        .db-bg::before {
            content: '';
            position: absolute;
            inset: 0;
            background:
                radial-gradient(ellipse 80% 60% at 15% 20%, rgba(0, 150, 255, 0.18) 0%, transparent 55%),
                radial-gradient(ellipse 60% 50% at 85% 10%, rgba(100, 0, 255, 0.14) 0%, transparent 50%),
                radial-gradient(ellipse 70% 55% at 50% 100%, rgba(0, 255, 220, 0.10) 0%, transparent 55%),
                radial-gradient(ellipse 50% 40% at 90% 80%, rgba(0, 80, 255, 0.12) 0%, transparent 50%),
                linear-gradient(160deg, #02060f 0%, #010416 30%, #020820 60%, #010512 100__);
        }

        .db-orb {
            position: absolute;
            border-radius: 50%;
            filter: blur(80px);
            opacity: 0;
            animation: orbDrift 18s ease-in-out infinite;
        }
        .db-orb-1 {
            width: 520px; height: 520px;
            top: -120px; left: -100px;
            background: radial-gradient(circle, rgba(0, 120, 255, 0.30) 0%, transparent 70%);
            animation-delay: 0s; animation-duration: 20s;
        }
        .db-orb-2 {
            width: 400px; height: 400px;
            top: 10%; right: -80px;
            background: radial-gradient(circle, rgba(120, 0, 255, 0.22) 0%, transparent 70%);
            animation-delay: -7s; animation-duration: 24s;
        }
        .db-orb-3 {
            width: 480px; height: 480px;
            bottom: -80px; left: 30%;
            background: radial-gradient(circle, rgba(0, 200, 255, 0.18) 0%, transparent 70%);
            animation-delay: -13s; animation-duration: 22s;
        }
        .db-orb-4 {
            width: 300px; height: 300px;
            top: 45%; right: 25%;
            background: radial-gradient(circle, rgba(60, 0, 180, 0.16) 0%, transparent 70%);
            animation-delay: -4s; animation-duration: 19s;
        }
        .db-orb-5 {
            width: 350px; height: 350px;
            bottom: 10%; right: -50px;
            background: radial-gradient(circle, rgba(0, 255, 180, 0.12) 0%, transparent 70%);
            animation-delay: -9s; animation-duration: 26s;
        }

        @keyframes orbDrift {
            0%   { opacity: 0.6; transform: translate(0, 0) scale(1); }
            25%  { opacity: 0.8; transform: translate(30px, -20px) scale(1.05); }
            50%  { opacity: 0.55; transform: translate(-20px, 30px) scale(0.97); }
            75%  { opacity: 0.75; transform: translate(15px, 10px) scale(1.03); }
            100% { opacity: 0.6; transform: translate(0, 0) scale(1); }
        }

        .db-grid {
            position: absolute;
            inset: 0;
            background-image:
                linear-gradient(rgba(0, 200, 255, 0.035) 1px, transparent 1px),
                linear-gradient(90deg, rgba(0, 200, 255, 0.035) 1px, transparent 1px);
            background-size: 60px 60px;
            mask-image: radial-gradient(ellipse 100% 100% at 50% 50%, black 20%, transparent 80%);
            -webkit-mask-image: radial-gradient(ellipse 100% 100% at 50% 50%, black 20%, transparent 80%);
        }

        .db-particles {
            position: absolute;
            inset: 0;
        }
        .db-star {
            position: absolute;
            border-radius: 50%;
            background: #ffffff;
            animation: starTwinkle linear infinite;
        }

        @keyframes starTwinkle {
            0%, 100% { opacity: 0.05; transform: scale(1); }
            50% { opacity: 0.55; transform: scale(1.6); }
        }

        .db-topbar-glow {
            position: absolute;
            top: 0; left: 0; right: 0;
            height: 2px;
            background: linear-gradient(90deg, transparent 0%, rgba(0, 200, 255, 0.7) 30%, rgba(120, 0, 255, 0.7) 70%, transparent 100%);
            animation: topbarGlowPulse 4s ease-in-out infinite;
        }
        @keyframes topbarGlowPulse {
            0%, 100% { opacity: 0.4; }
            50% { opacity: 1; }
        }

        /* Glass Cards overriding */
        html.dark-theme .resume-card {
            background: rgba(8, 14, 30, 0.75) !important;
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border-color: rgba(0, 255, 255, 0.14) !important;
        }

        /* Scrollbar */
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: var(--page-bg); }
        ::-webkit-scrollbar-thumb { background: rgba(0, 255, 255, 0.2); border-radius: 99px; }
        ::-webkit-scrollbar-thumb:hover { background: #00ffff; }

        body {
            min-height: 100vh;
            font-family: 'Inter', sans-serif;
            position: relative;
            overflow-x: hidden;
            transition: background-color 0.25s ease, color 0.25s ease;
        }

        

        .container { position: relative; z-index: 1; }

        .resume-card {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 24px;
            padding: 2.5rem 2rem;
            text-align: center;
            box-shadow: var(--card-shadow);
            transition: border-color 0.3s, background-color 0.25s;
            animation: slideUp 0.5s cubic-bezier(0.22, 1, 0.36, 1) both;
        }

        @keyframes slideUp {
            from { opacity: 0; transform: translateY(28px); }
            to   { opacity: 1; transform: translateY(0); }
        }

        .resume-card:hover {
            border-color: rgba(59, 130, 246, 0.25);
        }

        .resume-icon {
            width: 72px; height: 72px;
            border-radius: 18px;
            background: linear-gradient(135deg, rgba(245, 158, 11, 0.15), rgba(245, 158, 11, 0.05));
            border: 1px solid rgba(245, 158, 11, 0.25);
            display: flex; align-items: center; justify-content: center;
            font-size: 2rem;
            color: #d97706;
            margin: 0 auto 1.25rem;
        }

        html.dark-theme .resume-icon {
            background: rgba(245, 158, 11, 0.12);
            border-color: rgba(245, 158, 11, 0.20);
            color: #fbbf24;
        }

        .resume-card h4 {
            font-family: 'Outfit', sans-serif;
            font-weight: 800;
            font-size: 1.35rem;
            color: var(--heading-color);
            margin-bottom: 0.6rem;
            letter-spacing: -0.02em;
        }

        .resume-card p {
            color: var(--body-color);
            font-size: 0.93rem;
            margin-bottom: 1.6rem;
            line-height: 1.6;
        }

        .btn-resume-action {
            font-family: 'Outfit', sans-serif;
            font-weight: 700;
            border-radius: 12px;
            padding: 12px 22px;
            font-size: 0.92rem;
            transition: all 0.18s ease;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 7px;
            letter-spacing: 0.01em;
        }

        .btn-resume-primary {
            background: linear-gradient(135deg, #3b82f6, #1d4ed8);
            color: #fff;
            border: none;
            box-shadow: 0 4px 14px rgba(37, 99, 235, 0.3);
        }

        .btn-resume-primary:hover {
            color: #fff;
            transform: translateY(-2px);
            box-shadow: 0 8px 22px rgba(37, 99, 235, 0.4);
            filter: brightness(1.05);
        }

        .btn-resume-danger {
            background: transparent;
            color: #ef4444;
            border: 1.5px solid rgba(239, 68, 68, 0.35);
        }

        .btn-resume-danger:hover {
            background: rgba(239, 68, 68, 0.07);
            border-color: #ef4444;
            color: #dc2626;
            transform: translateY(-1px);
        }

        html.dark-theme .btn-resume-danger {
            color: #f87171;
            border-color: rgba(248, 113, 113, 0.35);
        }

        html.dark-theme .btn-resume-danger:hover {
            background: rgba(248, 113, 113, 0.10);
            border-color: #f87171;
            color: #fca5a5;
        }
    </style>
</head>
<body>
<!-- ══ GOATED ANIMATED BACKGROUND ══ -->
<div class="db-bg" aria-hidden="true">
    <div class="db-orb db-orb-1"></div>
    <div class="db-orb db-orb-2"></div>
    <div class="db-orb db-orb-3"></div>
    <div class="db-orb db-orb-4"></div>
    <div class="db-orb db-orb-5"></div>
    <div class="db-grid"></div>
    <div class="db-particles" id="dbParticles"></div>
    <div class="db-topbar-glow"></div>
</div>

{% include 'navbar.html' %}
<div class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-md-8 col-lg-7 col-xl-6">
            <div class="resume-card">
                <div class="resume-icon">
                    <i class="bi bi-clock-history"></i>
                </div>
                <h4>Interview In Progress</h4>
                <p>You have an interview session in progress. Would you like to continue where you left off, or start a fresh interview?</p>
                <div class="d-flex flex-column gap-3">
                    <a href="/interview?resume=yes" class="btn-resume-action btn-resume-primary justify-content-center">
                        <i class="bi bi-play-fill"></i> Resume Interview
                    </a>
                    <a href="/interview?resume=no" class="btn-resume-action btn-resume-danger justify-content-center">
                        <i class="bi bi-arrow-counterclockwise"></i> Start New Interview
                    </a>
                </div>
            </div>
        </div>
</div>

<script>
/* ── Resume Interview page background particle spawner ── */
(function() {
    var container = document.getElementById('dbParticles');
    if (!container) return;
    var count = 60;
    for (var i = 0; i < count; i++) {
        var star = document.createElement('div');
        star.className = 'db-star';
        var size = Math.random() * 2 + 1;
        star.style.cssText = [
            'width:' + size + 'px',
            'height:' + size + 'px',
            'left:' + (Math.random() * 100) + '%',
            'top:' + (Math.random() * 100) + '%',
            'animation-duration:' + (Math.random() * 4 + 2) + 's',
            'animation-delay:' + (Math.random() * 6) + 's'
        ].join(';');
        container.appendChild(star);
    }
})();
</script>

</body>
</html>
