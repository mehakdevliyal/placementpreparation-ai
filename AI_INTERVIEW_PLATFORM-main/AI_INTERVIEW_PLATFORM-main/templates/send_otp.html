<!DOCTYPE html>
<html lang="en" class="dark-theme">
<head>
    <title>Email OTP Login - AI Interview Platform</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Sign in with your Gmail via OTP verification.">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800;900&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
    <script>
    (function() {
        document.documentElement.classList.add('dark-theme');
            document.documentElement.setAttribute('data-theme', 'dark');
            localStorage.setItem('theme', 'dark');
    })();
    </script>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <style>
        /* â”€â”€ Design Tokens â”€â”€ */
        :root {
            --page-bg:           #f0f4ff;
            --page-glow:         rgba(59, 130, 246, 0.07);
            --card-bg:           #ffffff;
            --card-border:       rgba(0, 0, 0, 0.07);
            --card-shadow:       0 20px 50px rgba(37, 99, 235, 0.08);
            --card-hover-border: rgba(59, 130, 246, 0.28);
            --label-color:       #1e293b;
            --input-bg:          #f8fafc;
            --input-border:      rgba(0, 0, 0, 0.10);
            --input-color:       #0f172a;
            --input-focus-bg:    #ffffff;
            --back-bg:           #ffffff;
            --back-border:       rgba(0, 0, 0, 0.10);
            --back-color:        #475569;
            --back-hover-bg:     #f1f5f9;
            --back-hover-color:  #0f172a;
            --link-color:        #2563eb;
        }

        html.dark-theme {
            --page-bg:           #0b0f19;
            --page-glow:         rgba(59, 130, 246, 0.06);
            --card-bg:           rgba(10, 15, 29, 0.85);
            --card-border:       #334155;
            --card-shadow:       0 20px 50px rgba(0, 0, 0, 0.50);
            --card-hover-border: #00ffff;
            --label-color:       #ffffff;
            --input-bg:          #0b1329;
            --input-border:      #475569;
            --input-color:       #ffffff;
            --input-focus-bg:    #0f1c3d;
            --back-bg:           #0f1c3a;
            --back-border:       #475569;
            --back-color:        #ffffff;
            --back-hover-bg:     rgba(0,255,255,0.15);
            --back-hover-color:  #ffffff;
            --link-color:        #00ffff;
        }

        body {
            min-height: 100vh;
            
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Inter', sans-serif;
            position: relative;
            overflow-x: hidden;
            transition: background-color 0.25s ease, color 0.25s ease;
        }

        

        

        .login-outer-wrap {
            width: 100%;
            padding: 2.5rem 1rem;
            z-index: 10;
        }

        .login-card {
            border: 1px solid var(--card-border) !important;
            border-radius: 24px !important;
            background: rgba(10, 15, 29, 0.65) !important;
            overflow: hidden;
            box-shadow: var(--card-shadow) !important;
            transition: border-color 0.3s, background-color 0.25s;
        }

        .login-card:hover {
            border-color: var(--card-hover-border) !important;
        }

        .login-header {
            background: linear-gradient(135deg, #3b82f6 0%, #1d4ed8 100%);
            padding: 40px 32px;
            text-align: center;
            position: relative;
        }

        .login-header::before {
            content: '';
            position: absolute;
            top: -20px; left: 50%;
            transform: translateX(-50%);
            width: 200px; height: 200px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.07);
            pointer-events: none;
        }

        .login-header i {
            font-size: 2.5rem;
            color: #fff;
            margin-bottom: 12px;
            display: inline-block;
            text-shadow: 0 4px 12px rgba(0, 0, 0, 0.15);
        }

        .login-header h2 {
            font-family: 'Outfit', sans-serif;
            font-weight: 800;
            color: #fff;
            margin-bottom: 8px;
            letter-spacing: -0.02em;
        }

        .login-header p {
            color: rgba(255, 255, 255, 0.85);
            font-size: 0.9rem;
            margin: 0;
        }

        .form-body {
            padding: 36px 40px;
            
            transition: background-color 0.25s ease;
        }

        .form-label {
            font-family: 'Outfit', sans-serif;
            font-weight: 600;
            font-size: 0.85rem;
            color: var(--label-color);
            margin-bottom: 8px;
            letter-spacing: 0.02em;
        }

        .form-control {
            background: var(--input-bg) !important;
            border: 1px solid var(--input-border) !important;
            color: var(--input-color) !important;
            border-radius: 12px !important;
            padding: 12px 16px !important;
            font-size: 0.95rem;
            transition: all 0.2s ease !important;
        }

        .form-control::placeholder { opacity: 0.5; }

        .form-control:focus {
            border-color: #3b82f6 !important;
            box-shadow: none !important;
            background: var(--input-focus-bg) !important;
            outline: none;
        }

        .btn-login {
            background: linear-gradient(135deg, #3b82f6, #1d4ed8) !important;
            border: none !important;
            padding: 14px !important;
            border-radius: 12px !important;
            font-family: 'Outfit', sans-serif;
            font-weight: 700;
            letter-spacing: 0.01em;
            box-shadow: 0 4px 14px rgba(59, 130, 246, 0.3) !important;
            transition: all 0.2s ease !important;
            color: #fff;
        }

        .btn-login:hover {
            color: #fff;
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(59, 130, 246, 0.4) !important;
        }

        .text-link {
            color: var(--link-color);
            font-weight: 600;
            text-decoration: none;
            transition: opacity 0.15s ease;
        }
        .text-link:hover { opacity: 0.8; }

        .back-btn-global {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            color: var(--back-color);
            background: var(--back-bg);
            border: 1px solid var(--back-border);
            padding: 8px 18px;
            border-radius: 10px;
            font-family: 'Outfit', sans-serif;
            font-weight: 600;
            font-size: 0.88rem;
            text-decoration: none;
            transition: all 0.2s ease;
        }

        .back-btn-global:hover {
            color: var(--back-hover-color);
            background: var(--back-hover-bg);
            border-color: rgba(59, 130, 246, 0.3);
            transform: translateY(-1px);
        }

        html.dark-theme .back-btn-global:hover {
            border-color: rgba(255, 255, 255, 0.20);
        }

        @media (max-width: 576px) {
            .form-body { padding: 28px 22px; }
            .login-header { padding: 28px 22px; }
        }
        /* ══ GOATED BG OVERRIDES ══ */
        html.dark-theme body {
            background: #020510 !important;
            background-image: none !important;
        }
        .db-bg {
            position: fixed; inset: 0; z-index: 0;
            pointer-events: none; overflow: hidden; display: none;
        }
        html.dark-theme .db-bg { display: block; }
        .db-bg::before {
            content: ''; position: absolute; inset: 0;
            background:
                radial-gradient(ellipse 80% 60% at 15% 20%, rgba(0,150,255,0.18) 0%, transparent 55%),
                radial-gradient(ellipse 60% 50% at 85% 10%, rgba(100,0,255,0.14) 0%, transparent 50%),
                radial-gradient(ellipse 70% 55% at 50% 100%, rgba(0,255,220,0.10) 0%, transparent 55%),
                radial-gradient(ellipse 50% 40% at 90% 80%, rgba(0,80,255,0.12) 0%, transparent 50%),
                linear-gradient(160deg,#02060f 0%,#010416 30%,#020820 60%,#010512 100%);
        }
        .db-orb { position:absolute; border-radius:50%; filter:blur(80px); opacity:0; animation:orbDrift 18s ease-in-out infinite; }
        .db-orb-1 { width:520px;height:520px;top:-120px;left:-100px;background:radial-gradient(circle,rgba(0,120,255,0.30) 0%,transparent 70%);animation-delay:0s;animation-duration:20s; }
        .db-orb-2 { width:400px;height:400px;top:10%;right:-80px;background:radial-gradient(circle,rgba(120,0,255,0.22) 0%,transparent 70%);animation-delay:-7s;animation-duration:24s; }
        .db-orb-3 { width:480px;height:480px;bottom:-80px;left:30%;background:radial-gradient(circle,rgba(0,200,255,0.18) 0%,transparent 70%);animation-delay:-13s;animation-duration:22s; }
        .db-orb-4 { width:300px;height:300px;top:45%;right:25%;background:radial-gradient(circle,rgba(60,0,180,0.16) 0%,transparent 70%);animation-delay:-4s;animation-duration:19s; }
        .db-orb-5 { width:350px;height:350px;bottom:10%;right:-50px;background:radial-gradient(circle,rgba(0,255,180,0.12) 0%,transparent 70%);animation-delay:-9s;animation-duration:26s; }
        @keyframes orbDrift {
            0%   { opacity:0.6; transform:translate(0,0) scale(1); }
            25%  { opacity:0.8; transform:translate(30px,-20px) scale(1.05); }
            50%  { opacity:0.55; transform:translate(-20px,30px) scale(0.97); }
            75%  { opacity:0.75; transform:translate(15px,10px) scale(1.03); }
            100% { opacity:0.6; transform:translate(0,0) scale(1); }
        }
        .db-grid {
            position:absolute; inset:0;
            background-image: linear-gradient(rgba(0,200,255,0.035) 1px,transparent 1px), linear-gradient(90deg,rgba(0,200,255,0.035) 1px,transparent 1px);
            background-size:60px 60px;
            mask-image:radial-gradient(ellipse 100% 100% at 50% 50%,black 20%,transparent 80%);
            -webkit-mask-image:radial-gradient(ellipse 100% 100% at 50% 50%,black 20%,transparent 80%);
        }
        .db-particles { position:absolute; inset:0; }
        .db-star { position:absolute; border-radius:50%; background:#ffffff; animation:starTwinkle linear infinite; }
        @keyframes starTwinkle {
            0%,100% { opacity:0.05; transform:scale(1); }
            50%      { opacity:0.55; transform:scale(1.6); }
        }
        .db-topbar-glow {
            position:absolute; top:0; left:0; right:0; height:2px;
            background:linear-gradient(90deg,transparent 0%,rgba(0,200,255,0.7) 30%,rgba(120,0,255,0.7) 70%,transparent 100%);
            animation:topbarGlowPulse 4s ease-in-out infinite;
        }
        @keyframes topbarGlowPulse { 0%,100%{opacity:0.4;} 50%{opacity:1;} }
        ::-webkit-scrollbar{width:6px;height:6px;}
        ::-webkit-scrollbar-track{background:transparent;}
        ::-webkit-scrollbar-thumb{background:rgba(0,255,255,0.2);border-radius:99px;}
        ::-webkit-scrollbar-thumb:hover{background:#00ffff;}
    </style>
</head>
<body>
<!-- ══ GOATED ANIMATED BACKGROUND ══ -->
<div class="db-bg" aria-hidden="true">
    <div class="db-orb db-orb-1"></div>
    <div class="db-orb db-orb-2"></div>
    <div class="db-orb db-orb-3"></div>
    <div class="db-orb db-orb-4"></div>
    <div class="db-orb db-orb-5"></div>
    <div class="db-grid"></div>
    <div class="db-particles" id="dbParticles"></div>
    <div class="db-topbar-glow"></div>
</div>
<div class="login-outer-wrap">
<div class="container">
    <div class="row justify-content-center">
        <div class="col-md-8 col-lg-7 col-xl-6">
            <a href="/login" class="back-btn-global mb-3">
                <i class="bi bi-arrow-left"></i> BACK
            </a>
            <div class="card login-card shadow-lg">
                <div class="login-header">
                    <i class="bi bi-envelope-at"></i>
                    <h2>Email OTP Login</h2>
                    <p>Enter your email address below to receive a secure 6-digit OTP verification code</p>
                </div>

                <div class="form-body">
                    {% if error %}
                    <div class="alert alert-danger">{{ error }}</div>
                    {% endif %}

                    <form method="POST" action="/auth/otp/send" id="otpLoginForm">
                        <div class="mb-3">
                            <label class="form-label" for="email">Email Address</label>
                            <input type="email" name="email" id="email" class="form-control" placeholder="name@example.com" required>
                        </div>

                        <button type="submit" class="btn btn-login w-100 text-white mb-3">
                            Send OTP
                        </button>

                        <div class="text-center">
                            <a href="/login" class="text-link">
                                <i class="bi bi-arrow-left"></i> BACK
                            </a>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
</div>
<script>
(function(){
    var c=document.getElementById('dbParticles');
    if(!c)return;
    for(var i=0;i<60;i++){
        var s=document.createElement('div');
        s.className='db-star';
        var sz=Math.random()*2+1;
        s.style.cssText='width:'+sz+'px;height:'+sz+'px;left:'+(Math.random()*100)+'%;top:'+(Math.random()*100)+'%;animation-duration:'+(Math.random()*4+2)+'s;animation-delay:'+(Math.random()*6)+'s';
        c.appendChild(s);
    }
})();

// Loading spinner on OTP submit
(function(){
    var form = document.getElementById('otpLoginForm');
    if(!form) return;
    form.addEventListener('submit', function(){
        var btn = form.querySelector('button[type="submit"]');
        if(btn){
            btn.disabled = true;
            btn.innerHTML = '<span class="spinner-border spinner-border-sm me-2" role="status"></span>Sending OTP…';
        }
    });
})();
</script>
</body>
</html>
