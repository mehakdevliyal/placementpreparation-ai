services:
  - type: web
    name: ai-interview-platform
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --workers 2 --threads 4 --worker-class gthread --worker-tmp-dir /dev/shm --timeout 120
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: ai-interview-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: GEMINI_API_KEY
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: RENDER
        value: "true"
    disk:
      name: platform-data
      mountPath: /var/data
      sizeGB: 1

databases:
  - name: ai-interview-db
    databaseName: ai_interview_platform
    user: db_user
    plan: free
